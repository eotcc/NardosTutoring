<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">

    <!-- Header Toast -->
    <div id="toast" class="fixed top-5 right-5 flex items-center gap-2 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg transition-transform duration-300 translate-x-full z-50">
        <i id="toast-icon" data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
        <span id="toast-message" class="text-xs font-medium"></span>
    </div>

    <div class="max-w-4xl mx-auto bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden flex flex-col md:flex-row h-[600px]">
        
        <!-- Sidebar: Student Search & Selection -->
        <div class="w-full md:w-1/3 border-r border-slate-200 bg-slate-50 flex flex-col">
            <div class="p-3 border-b border-slate-200 bg-white">
                <h2 class="font-bold text-xs text-slate-800 mb-2">Student Directory</h2>
                <input type="text" id="teacher-search" oninput="filterStudentList()" placeholder="Search name or ID..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div id="teacher-student-list" class="flex-1 overflow-y-auto p-2 space-y-2"></div>
        </div>

        <!-- Chat Main Area -->
        <div class="w-full md:w-2/3 flex flex-col bg-white">
            
            <!-- Default Placeholder when no student selected -->
            <div id="no-student-selected" class="flex-1 flex flex-col items-center justify-center p-6 text-center">
                <i data-lucide="message-square" class="w-10 h-10 text-slate-300 mb-2"></i>
                <h3 class="text-xs font-bold text-slate-600">Select a student</h3>
                <p class="text-[10px] text-slate-400">Choose a registered student from the left directory to view conversations.</p>
            </div>

            <!-- Active Chat Thread View -->
            <div id="active-chat-container" class="hidden flex-1 flex flex-col h-full">
                <div class="p-3 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                    <div>
                        <h3 id="chat-student-name" class="font-bold text-xs text-slate-800"></h3>
                        <p id="chat-student-meta" class="text-[10px] text-slate-400"></p>
                    </div>
                </div>

                <div id="teacher-messages-thread" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50/50"></div>

                <form onsubmit="sendTeacherReply(event)" class="p-3 border-t border-slate-200 flex gap-2">
                    <input type="text" id="replyText" placeholder="Write a reply..." required class="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-xl transition-colors">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>

        </div>

    </div>

    <script type="module" src="teacher_msgr.js"></script>
</body>
</html>
