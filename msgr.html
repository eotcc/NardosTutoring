<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Direct Message Portal - Nardos Tutoring</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom External CSS -->
    <link rel="stylesheet" href="msgr.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800 flex flex-col justify-between pb-12">

    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-100 text-indigo-700 p-2 rounded-xl">
                <i data-lucide="message-square" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-900 text-base">Student Direct Message Portal</h1>
                <p class="text-xs text-slate-500">Nardos Tutoring</p>
            </div>
        </div>
        <div id="student-badge-header" class="hidden items-center space-x-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span id="header-student-name" class="text-xs font-semibold text-slate-700">Student Name</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto px-4 w-full mt-8">

        <!-- STEP 1: ENTER CODE VIEW -->
        <div id="step-login-card" class="card-container bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm text-center">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i data-lucide="key-round" class="w-6 h-6"></i>
            </div>
            <h2 class="text-lg font-bold text-slate-900">Enter Your Student Code</h2>
            <p class="text-xs text-slate-500 mt-1 mb-6">Type the 6-character code you received when you registered (e.g., JD4821).</p>

            <form id="codeForm" onsubmit="verifyStudentCode(event)" class="space-y-4">
                <div>
                    <input type="text" id="studentCodeInput" required placeholder="ENTER CODE (e.g. JD4821)" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-center text-lg font-mono uppercase tracking-widest focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
                </div>
                <button type="submit" class="btn-primary w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md transition-all">
                    Access Direct Message
                </button>
            </form>
        </div>

        <!-- STEP 2: MESSAGING VIEW (Hidden by default) -->
        <div id="step-messaging-card" class="card-container bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm hidden space-y-6">
            <!-- Student Profile Bar -->
            <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                <div class="flex items-center space-x-3">
                    <div id="student-initials-badge" class="w-10 h-10 bg-indigo-600 text-white font-bold rounded-xl flex items-center justify-center text-sm font-mono">
                        JD
                    </div>
                    <div>
                        <h3 id="display-student-name" class="font-bold text-slate-900 text-base">John Doe</h3>
                        <p class="text-xs text-slate-500">Grade: <span id="display-student-grade" class="font-medium text-slate-700">10th Grade</span> • Code: <span id="display-student-id" class="font-mono font-semibold text-indigo-600">JD4821</span></p>
                    </div>
                </div>
                <button onclick="logoutStudent()" class="text-xs text-slate-400 hover:text-rose-600 px-3 py-1.5 rounded-lg hover:bg-rose-50 transition-all font-medium">
                    Switch Code
                </button>
            </div>

            <!-- Message Form -->
            <form id="messageForm" onsubmit="sendStudentMessage(event)" class="space-y-4">
                <div>
                    <label class="input-label block text-xs font-semibold uppercase text-slate-500 mb-1">Send a Message to Tutor / Admin</label>
                    <textarea id="messageText" rows="4" required placeholder="Type your question, homework note, or check-in message here..." class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all resize-none"></textarea>
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="btn-primary px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md transition-all flex items-center space-x-2">
                        <i data-lucide="send" class="w-4 h-4"></i>
                        <span>Send Message</span>
                    </button>
                </div>
            </form>

            <!-- Previous Sent Messages List -->
            <div class="pt-4 border-t border-slate-100">
                <h4 class="text-xs font-bold uppercase text-slate-400 tracking-wider mb-3">Your Sent Messages</h4>
                <div id="student-messages-list" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                    <p class="text-xs text-slate-400 italic text-center py-4">No messages sent yet.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Floating Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-x-full transition-transform duration-300 ease-out bg-white border border-slate-200 shadow-xl rounded-2xl p-4 flex items-center space-x-3 max-w-sm">
        <i id="toast-icon" data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
        <p id="toast-message" class="text-xs font-medium text-slate-700">Notification message here</p>
    </div>

    <!-- Script Module -->
    <script type="module" src="msgr.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
</body>
</html>
