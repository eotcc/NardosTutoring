<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Saturday Church School</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800 pb-12">

    <!-- Top Navigation Header -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm mb-8">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-600 p-2 rounded-xl transition-all" title="Back to Dashboard">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="font-bold text-slate-900 text-base">Student Registration Portal</h1>
            </div>
        </div>
        <div class="flex items-center space-x-2 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-100">
            <i data-lucide="users" class="w-4 h-4 text-indigo-600"></i>
            <span class="text-xs font-semibold text-indigo-700">Total Entries: <span id="records-count-badge">0</span></span>
        </div>
    </header>

    <!-- Main Form Container -->
    <main class="max-w-2xl mx-auto px-4">
        <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
            <div class="mb-6 pb-4 border-b border-slate-100">
                <h2 class="text-lg font-bold text-slate-900">New Student Form</h2>
                <p class="text-xs text-slate-500 mt-0.5">Fill out student details and configure attendance schedules.</p>
            </div>

            <form id="registrationForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
                <!-- Name Fields -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">First Name</label>
                        <input type="text" id="firstName" required placeholder="John" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Last Name</label>
                        <input type="text" id="lastName" required placeholder="Doe" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm outline-none transition-all">
                    </div>
                </div>

                <!-- Grade & Phone Fields -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Grade / Class</label>
                        <select id="grade" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm outline-none transition-all">
                            <option value="">Select Grade</option>
                            <option value="Elementary">Elementary</option>
                            <option value="Middle School">Middle School</option>
                            <option value="High School">High School</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Parent Phone</label>
                        <input type="tel" id="phone" required placeholder="(555) 000-0000" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm outline-none transition-all">
                    </div>
                </div>

                <!-- Day Selector Checkboxes -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-2">Select Attendance Days</label>
                    <div id="day-buttons-container" class="grid grid-cols-4 sm:grid-cols-7 gap-2">
                        <!-- Dynamically populated via JS -->
                    </div>
                </div>

                <!-- Dynamic Schedule Time Slots Container -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-2">Configure Time Slots</label>
                    <div id="schedule-slots-container" class="space-y-3">
                        <!-- Dynamically populated via JS -->
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
                    <a href="index.html" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl text-sm transition-all">
                        Cancel
                    </a>
                    <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md transition-all">
                        Save Registration
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Floating Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-x-full transition-transform duration-300 ease-out bg-white border border-slate-200 shadow-xl rounded-2xl p-4 flex items-center space-x-3 max-w-sm">
        <i id="toast-icon" data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
        <p id="toast-message" class="text-xs font-medium text-slate-700">Notification message here</p>
    </div>

    <!-- Registration Logic Script -->
    <script src="regstr.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
