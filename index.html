<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nardos Tutoring - Admin Sign In</title>
    <link rel="stylesheet" href="Admin.css">
</head>
<body>

    <div class="login-container">
        <h2>Admin Sign In</h2>

        <!-- REPLACE YOUR FORM WITH THESE LINES (around lines 11 to 33) -->
        <form id="adminLoginForm" autocomplete="off">
            <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                autocomplete="off"
                required
            >
            <input
                type="password"
                id="adminPassword"
                placeholder="Enter password"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="loginButton">
                Sign In
            </button>

            <p id="loginMessage" class="message error" role="alert"></p>
        </form>
        <!-- END OF REPLACEMENT -->

    </div>

    <!-- Admin Sign-In Script -->
    <script type="module" src="Admin.js"></script>

</body>
</html>
