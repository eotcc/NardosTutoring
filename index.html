<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Saturday Church School</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Admin Stylesheet -->
    <link rel="stylesheet" href="Admin.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased text-slate-800">

    <!-- 1. ADMIN LOGIN CONTAINER -->
    <div id="adminLogin" class="flex items-center justify-center min-h-screen px-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
            <div class="text-center mb-6">
                <div class="bg-indigo-50 text-indigo-600 w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-3 shadow-sm">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold text-slate-900">Admin Portal</h1>
            </div>

            <form id="adminLoginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Email Address</label>
                    <input type="email" id="adminEmail" required autocomplete="email" placeholder="Username" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm outline-none transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
                    <input type="password" id="adminPassword" required autocomplete="current-password" placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm outline-none transition-all">
                </div>
                <button type="submit" id="loginButton" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md transition-all">
                    Sign In
                </button>
            </form>
            <p id="loginMessage" class="text-center text-xs text-rose-500 font-medium mt-4 min-h-[1.25rem]"></p>
        </div>
    </div>

    <!-- 2. ADMIN DASHBOARD CONTAINER (Hidden by default) -->
    <div id="adminDashboard" style="display: none;" class="min-h-screen flex flex-col">
        <!-- Top Navigation Header -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-500">Admin Control Panel</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button id="signOutButton" class="flex items-center space-x-2 px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold text-xs rounded-xl transition-all">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span>Sign Out</span>
                </button>
            </div>
        </header>

        <!-- Dashboard Main Workspace -->
        <main class="flex-1 max-w-5xl w-full mx-auto p-6 space-y-6">
            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-900">Student Registrations</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Manage new student entries or register a new attendee.</p>
                </div>
                <a href="register.html" class="flex items-center space-x-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-xl shadow-sm transition-all">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                    <span>Register New Student</span>
                </a>
            </div>

            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                <p id="dashboardMessage" class="text-sm text-slate-600">Welcome to your dashboard. Use the button above to add registrations or review records.</p>
            </div>
        </main>
    </div>

    <!-- Firebase Admin Script Module -->
    <script type="module" src="Admin.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
