<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="stumsgr.css" />
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-4 right-4 z-50 transform translate-x-full transition-transform duration-300 ease-in-out bg-white border border-slate-200 shadow-xl rounded-xl p-4 flex items-center gap-3">
    <i id="toast-icon" data-lucide="check-circle-2" class="w-5 h-5 text-indigo-600"></i>
    <span id="toast-message" class="text-sm font-medium text-slate-700"></span>
  </div>

  <main class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/80 overflow-hidden">
    
    <!-- Top Header & Student Badge -->
    <header class="bg-indigo-600 text-white p-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-xl font-bold">Student Portal</h1>
          <p class="text-xs text-indigo-200">NRD Tutoring Communication</p>
        </div>
        <button onclick="logoutStudent()" id="student-badge-header" class="hidden items-center gap-2 bg-indigo-700/60 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-full text-xs transition">
          <span id="student-initials-badge" class="font-bold bg-white text-indigo-600 w-6 h-6 rounded-full flex items-center justify-center text-[10px]">ST</span>
          <span id="header-student-name" class="font-medium max-w-[100px] truncate">Student</span>
          <i data-lucide="log-out" class="w-3.5 h-3.5 opacity-70"></i>
        </button>
      </div>
    </header>

    <div class="p-6">
      <!-- STEP 1: Login Card -->
      <section id="step-login-card" class="space-y-4">
        <div class="text-center space-y-1">
          <h2 class="text-lg font-semibold text-slate-800">Welcome Back</h2>
          <p class="text-xs text-slate-500">Enter your Student ID Code to access messages</p>
        </div>

        <form onsubmit="verifyStudentCode(event)" class="space-y-4 mt-4">
          <div>
            <label for="studentCodeInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Student ID Code</label>
            <input 
              type="text" 
              id="studentCodeInput" 
              placeholder="e.g. STU12345" 
              class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition uppercase"
              required
            />
          </div>
          <button 
            type="submit" 
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-sm hover:shadow active:scale-[0.99]">
            Verify Code
          </button>
        </form>
      </section>

      <!-- STEP 2: Messaging Card (Hidden by default) -->
      <section id="step-messaging-card" class="hidden space-y-4">
        <!-- Student Info Strip -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex justify-between text-xs text-slate-600">
          <div>
            <span class="block text-[10px] uppercase text-slate-400 font-semibold">Name</span>
            <span id="display-student-name" class="font-semibold text-slate-800">-</span>
          </div>
          <div>
            <span class="block text-[10px] uppercase text-slate-400 font-semibold">Grade</span>
            <span id="display-student-grade" class="font-semibold text-slate-800">-</span>
          </div>
          <div>
            <span class="block text-[10px] uppercase text-slate-400 font-semibold">ID</span>
            <span id="display-student-id" class="font-semibold text-slate-800">-</span>
          </div>
        </div>

        <!-- Send Message Input Form -->
        <form onsubmit="sendStudentMessage(event)" class="space-y-2">
          <label for="messageText" class="block text-xs font-semibold text-slate-600">New Message</label>
          <textarea 
            id="messageText" 
            rows="3" 
            placeholder="Type your message or question here..." 
            class="w-full p-3 text-xs rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition resize-none"
            required></textarea>
          <button 
            type="submit" 
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition">
            <i data-lucide="send" class="w-3.5 h-3.5"></i>
            Send Message
          </button>
        </form>

        <hr class="border-slate-200 my-4" />

        <!-- Messages History Feed -->
        <div>
          <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Message History</h3>
          <div id="student-messages-list" class="space-y-2.5 max-h-60 overflow-y-auto pr-1 custom-scrollbar">
            <p class="text-xs text-slate-400 italic text-center py-4">No messages sent yet.</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="stumsgr.js"></script>
</body>
</html>
